name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15.1
        env:
          POSTGRES_USER: glow_user
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://glow_user:postgres@localhost:5432/glow_test
      DIRECT_URL: postgresql://glow_user:postgres@localhost:5432/glow_test
      # apps/api reads this to decide which origins may send credentials.
      APP_FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Creates the tables in the service container above. The Prisma client
      # itself is generated by turbo: typecheck and test both declare
      # dependsOn ^prisma:generate.
      - name: Sync the test database with the schema
        run: pnpm prisma db push
        working-directory: packages/prisma

      - name: Check formatting
        run: pnpm prettier --check "apps/**/*.{ts,tsx}" "packages/**/*.{ts,tsx}"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
